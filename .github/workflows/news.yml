name: Sonic News Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: اجرای خبرخوان
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python github_news_bot.py

      - name: ذخیره خبرهای دیده‌شده
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_news.json
          git diff --cached --quiet || git commit -m "Update seen news"
          git push
